name = "pata-ai"
main = "worker.js"
compatibility_date = "2026-01-01"

# Serve on https://pata-ai.<your-subdomain>.workers.dev.
# Stated explicitly rather than relying on the default, so a deploy can never
# quietly land with no public route attached.
workers_dev = true

# The Mistral key is NOT set here — this file is committed to git.
# It is stored encrypted in Cloudflare:
#     npx wrangler secret put MISTRAL_API_KEY
#
# Model IDs are plain config, so you can change them without touching code.
# Verify current names at https://docs.mistral.ai/getting-started/models/
#
# Natural voices are OPTIONAL and use a SECOND, separate key. Without it the
# app reads aloud with the phone's own voice, which works but sounds flat over
# anything essay-length:
#     npx wrangler secret put SARVAM_API_KEY
# Sarvam's Bulbul is trained on Indian languages specifically. It covers
# eleven of the app's twelve; Assamese has no Bulbul voice and keeps using
# the phone.
[vars]
TEXT_MODEL = "mistral-small-latest"
VISION_MODEL = "pixtral-12b-2409"

# The voice itself. Change these to pick a different speaker — no code edit,
# no redeploy of the app. Names: https://docs.sarvam.ai/api/getting-started/models/bulbul.md
VOICE_MODEL = "bulbul:v3"
VOICE_SPEAKER = "shubh"

# Carrying quiz results between a child's phone and their teacher's. Only
# needed when they are DIFFERENT phones — on one shared device the results are
# already in the same database and this can be left off.
#
#   npx wrangler kv namespace create PATA_SYNC
#
# That prints an id. Paste it below, uncomment both lines, and deploy.
# No child's name is ever sent: the payload carries the roster id, and the
# teacher's phone turns that back into a name from the register it already has.
#
# [[kv_namespaces]]
# binding = "PATA_SYNC"
# id = "paste-the-id-wrangler-printed-here"
